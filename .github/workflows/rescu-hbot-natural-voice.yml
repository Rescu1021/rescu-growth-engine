name: RESCU HBOT — natural narration synced to captions
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/rescu-hbot-natural-voice.yml"
      - "campaigns/hbot-athletes-60s/kokoro_sync_voice.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/rescu-hbot-athletes-60s-lyric-video'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install open-source TTS runtime
        run: |
          python -m pip install -U pip
          python -m pip install -U kokoro-onnx numpy soundfile scipy "misaki[en]"
          sudo apt-get -qq update
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Download public Kokoro model weights
        run: |
          curl -fL --retry 3 --output kokoro-v1.0.int8.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx"
          curl -fL --retry 3 --output voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin"
          test "$(stat -c%s kokoro-v1.0.int8.onnx)" -gt 90000000
          test "$(stat -c%s voices-v1.0.bin)" -gt 1000000
      - name: Synthesize cue-aligned natural male narration
        run: |
          python campaigns/hbot-athletes-60s/kokoro_sync_voice.py
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 rescu_hbot_natural_voice.wav
      - name: Upload mix-ready voice WAV and alignment report
        uses: actions/upload-artifact@v4
        with:
          name: rescu-hbot-natural-voice-sync
          path: |
            rescu_hbot_natural_voice.wav
            rescu_hbot_narration_alignment.json
          retention-days: 14
