name: RESCU Content Factory — local-only checks
on:
  pull_request:
    paths:
      - "rescu_growth/content_factory.py"
      - "rescu_growth/content_studio.py"
      - "rescu_growth/reel_render.py"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/content-factory-tests.yml"
  push:
    branches:
      - "feature/rescu-content-factory-20261031"
permissions:
  contents: read
jobs:
  offline-content-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional Pillow for graphics test
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Produce sample eight-campaign preview
        run: python -m rescu_growth.content_studio --manifest examples/2026-rescu-eight-campaigns.json --output-dir /tmp/rescu-drafts
      - name: Verify local preview output
        run: |
          test -f /tmp/rescu-drafts/index.html
          test -f /tmp/rescu-drafts/campaign-links.csv
          test -f /tmp/rescu-drafts/campaigns/trilift-demo-guide/cover-story.png
# No website deploy, no secrets, no publishing, no external content APIs.
